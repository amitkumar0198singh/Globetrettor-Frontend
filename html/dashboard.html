<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globetrotter Challenge</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <!-- Text Logo -->
            <a class="navbar-brand fw-bold fs-3 text-primary" href="#">Globetrotter</a>
    
            <!-- Navbar Toggle Button (For Mobile) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
    
                <!-- Login/Register Button (Hidden if logged in) -->
                <div id="loginButtonContainer" class="d-flex ms-3">
                    <a class="btn btn-primary text-white px-3" href="login.html">Login/Register</a>
                </div>
    
                <!-- User Dropdown (Hidden if not logged in) -->
                <div id="userDropdown" class="dropdown ms-3 d-none">
                    <a class="btn btn-secondary dropdown-toggle" href="#" role="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-solid fa-user"></i> <!-- User Icon -->
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                        <li><a class="dropdown-item" href="#">Profile</a></li>
                        <li><button class="dropdown-item" onclick="logout()">Logout</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
     

    <!-- Game Container -->
    <div class="container text-center mt-5">
        <h2>Globetrotter Challenge</h2>
        <p class="lead">Test your geography knowledge by answering these questions!</p>

        <!-- Timer & Score -->
        <h3 id="timer" class="text-danger mt-3 d-none">Time Left: <span id="time-left">60</span>s</h3>
        <h4 id="score" class="mt-3 d-none">Score: <span id="score-count">0</span></h4>

        <!-- Game Area -->
        <div id="game-container" class="mt-4">
            <button id="start-game" class="btn btn-success btn-lg">Start Game</button>
            
            <div id="question-area" class="d-none">
                <h4 id="clue" class="mt-3"></h4>
                <div id="choices" class="mt-3"></div>
                <p id="result" class="fw-bold mt-3"></p>

                <button id="next-question" class="btn btn-warning btn-lg mt-3 d-none">Next</button>
                <button id="end-game" class="btn btn-danger btn-lg mt-3">End Game</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
