<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globetrotter Challenge</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="container text-center mt-5">
        <h2>Globetrotter Challenge</h2>
        <p class="lead">Test your geography knowledge!</p>

        <!-- Timer & Score -->
        <h3 id="timer" class="text-danger mt-3">Time Left: <span id="time-left">60</span>s</h3>
        <h4 id="score" class="mt-3">Score: <span id="score-count">0</span></h4>

        <!-- Game Area -->
        <div id="game-container" class="mt-4">
            <div id="question-area">
                <h4 id="clue" class="mt-3"></h4>
                <div id="choices" class="mt-3"></div>
                <p id="result" class="fw-bold mt-3"></p>

                <button id="next-question" class="btn btn-warning btn-lg mt-3 d-none">Next</button>
                <button id="end-game" class="btn btn-danger btn-lg mt-3">End Game</button>
            </div>
        </div>

        <!-- Play Again & Invite Friend -->
        <div id="game-over" class="mt-4 d-none">
            <h3>Game Over!</h3>
            <button id="play-again" class="btn btn-primary btn-lg mt-3">Play Again</button>
            <button id="invite-friend" class="btn btn-success btn-lg mt-3">Invite a Friend</button>
        </div>

    </div>

    <script src="../js/game.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
